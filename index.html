<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="renderer" content="webkit" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="pragram" content="no-cache" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>
    <%= title %>
  </title>
  <!--[if lt IE 11
      ]><script>
        window.location.href = '/html/ie.html'
      </script><!
    [endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      box-sizing: border-box;
      padding: 24px;
      background: var(--umm-page-bg, radial-gradient(ellipse at 85% 0%, rgba(14, 179, 162, .12), transparent 40%), radial-gradient(ellipse at 5% 100%, rgba(163, 215, 242, .25), transparent 35%), linear-gradient(135deg, #f6fafb, #f0f8f8 55%, #f4f8fc));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      z-index: 999999;
    }

    #loader {
      display: block;
      position: relative;
      flex-shrink: 0;
      box-sizing: border-box;
      width: clamp(64px, 12vmin, 96px);
      height: clamp(64px, 12vmin, 96px);
      margin: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--umm-primary, #0eb3a2);
      -webkit-animation: spin 2s linear infinite;
      -ms-animation: spin 2s linear infinite;
      -moz-animation: spin 2s linear infinite;
      -o-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
      z-index: 1001;
    }

    #loader:before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--umm-primary, #0eb3a2);
      opacity: .65;
      -webkit-animation: spin 3s linear infinite;
      -moz-animation: spin 3s linear infinite;
      -o-animation: spin 3s linear infinite;
      -ms-animation: spin 3s linear infinite;
      animation: spin 3s linear infinite;
    }

    #loader:after {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--umm-primary, #0eb3a2);
      opacity: .35;
      -moz-animation: spin 1.5s linear infinite;
      -o-animation: spin 1.5s linear infinite;
      -ms-animation: spin 1.5s linear infinite;
      -webkit-animation: spin 1.5s linear infinite;
      animation: spin 1.5s linear infinite;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
        -ms-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
        -ms-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }

    .loaded #loader {
      opacity: 0;
      -webkit-transition: all 0.3s ease-out;
      transition: all 0.3s ease-out;
    }

    .loaded #loader-wrapper {
      visibility: hidden;
      -webkit-transform: translateY(-100%);
      -ms-transform: translateY(-100%);
      transform: translateY(-100%);
      -webkit-transition: all 0.3s 1s ease-out;
      transition: all 0.3s 1s ease-out;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }

    #loader-wrapper .load_title {
      color: var(--umm-text, #21374a);
      font-size: clamp(14px, 2.5vw, 18px);
      max-width: 100%;
      text-align: center;
      opacity: 1;
      line-height: 1.8;
    }

    @media (prefers-reduced-motion: reduce) {
      #loader, #loader:before, #loader:after { animation: none; }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>请启用JavaScript后再使用</strong>
  </noscript>

  <div id="app">
    <div id="loader-wrapper" role="status" aria-live="polite">
      <div id="loader" aria-hidden="true"></div>
      <div class="load_title">正在加载系统资源，请耐心等待</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    window.exports = {}
    window.module = {}
  </script>

  <!-- 使用CDN的JS文件 -->
  <!-- <% for (var i in cdn && cdn.js) { %>
    <script src="<%= cdn.js[i] %>"></script>
    <% } %> -->
</body>

</html>
